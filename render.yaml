# Render Blueprint (reference). The service + database are provisioned via the Render API;
# this documents the shape and lets a future `render.yaml` sync reproduce it.
services:
  - type: web
    name: valent-intelligence-server
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: media
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: valent-intelligence-db
          property: connectionString
      - key: MEDIA_ROOT
        value: /data/media
      - key: APK_DIR
        value: /data/apk
      - key: INGEST_TOKEN
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: valent-intelligence-db
    plan: basic_256mb
    region: frankfurt
    postgresMajorVersion: "16"
