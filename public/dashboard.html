<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Valent Intelligence — travels</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{--bg:#0d0d0d;--card:#1a1a19;--line:#2c2c2a;--ink:#fff;--mut:#8a8a86;--accent:#3987e5;--coral:#ff5a3c;--good:#0ca30c;--violet:#7c5cff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  header{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.02em}
  header .sp{flex:1}
  select,button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px}
  a.logout{color:var(--mut);font-size:12px;text-decoration:none}
  .lv{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--mut)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--mut);flex:none}
  .dot.on{background:var(--good);box-shadow:0 0 0 0 rgba(12,163,12,.6);animation:pulse 1.6s infinite}
  .dot.warn{background:#fab219}
  .dot.off{background:var(--coral)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(12,163,12,.5)}70%{box-shadow:0 0 0 7px rgba(12,163,12,0)}100%{box-shadow:0 0 0 0 rgba(12,163,12,0)}}
  .status{display:flex;gap:10px;flex-wrap:wrap;padding:12px 18px 4px}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 13px;min-width:120px}
  .chip .k{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
  .chip .v{font-size:17px;font-weight:700;margin-top:2px}
  .chip .v.flash{animation:flash .9s ease-out}
  @keyframes flash{0%{color:var(--violet)}100%{color:var(--ink)}}
  .feed{margin:6px 18px 0;height:26px;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--mut);white-space:nowrap}
  .feed .row{line-height:26px}
  .feed .add{color:var(--violet)}
  .audiobar{margin:8px 18px 0;display:flex;gap:10px;flex-wrap:wrap}
  .abchip{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 13px;display:flex;align-items:center;gap:9px;max-width:100%}
  .abchip .ic{font-size:17px;flex:none}
  .abchip .k{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
  .abchip .v{font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:66vw}
  .abchip.playing{border-color:var(--good)}
  .abchip.hearing{border-color:var(--violet)}
  .scenestrip{margin:8px 18px 0;display:flex;gap:6px;overflow-x:auto;align-items:center;padding-bottom:2px}
  .scenestrip .lbl{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;flex:none;margin-right:2px}
  .stag{background:#111;border:1px solid var(--line);border-radius:20px;padding:5px 11px;font-size:11px;white-space:nowrap;color:var(--mut);flex:none}
  .stag.cur{border-color:var(--violet);color:var(--ink)}
  .tbody{padding:12px 14px;max-height:240px;overflow:auto;font-size:14px;line-height:1.65;color:var(--ink)}
  .tbody .seg{color:var(--mut)}.tbody .seg.last{color:var(--ink)}
  .playerbar{padding:11px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .playerbar #aud{flex:1;min-width:240px;height:40px}
  .playerbar #golive{background:var(--coral);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;flex:none}
  .grid{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;padding:10px 18px 24px}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .panel h2{font-size:12px;margin:0;padding:11px 14px;border-bottom:1px solid var(--line);color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-weight:600;display:flex;justify-content:space-between}
  #map{height:520px}
  .gallery{padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;max-height:520px;overflow:auto}
  .gallery figure{margin:0;border-radius:8px;overflow:hidden;background:#000;aspect-ratio:1;position:relative}
  .gallery figure.fresh{outline:2px solid var(--violet);animation:flash 2s ease-out}
  .gallery img,.gallery video{width:100%;height:100%;object-fit:cover;display:block}
  .gallery .pv{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;padding:2px 5px;border-radius:4px}
  .empty{color:var(--mut);padding:24px;font-size:13px;text-align:center}
  .strwrap{margin:10px 18px 0}
  .strgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;padding:10px;max-height:210px;overflow:auto}
  .scell{background:#111;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  .scell.flash{animation:cellflash 1.4s ease-out}
  @keyframes cellflash{0%{border-color:var(--violet);background:#191527}100%{border-color:var(--line);background:#111}}
  .sname{font-size:11px;color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sval{font-size:13px;color:var(--violet);font-family:ui-monospace,Menlo,monospace;margin-top:2px}
  .sago{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
  .leaflet-container{background:#111}
  .gallery figure{cursor:pointer}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.93);display:none;align-items:center;justify-content:center;z-index:1000}
  .lightbox.open{display:flex}
  .lightbox img,.lightbox video{max-width:92vw;max-height:82vh;border-radius:8px;background:#000}
  .lb-cap{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:#ccc;font-family:ui-monospace,Menlo,monospace;font-size:12px;padding:0 10px}
  .lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(20,20,20,.7);color:#fff;border:1px solid var(--line);width:46px;height:64px;font-size:24px;cursor:pointer;border-radius:10px}
  .lb-nav.prev{left:14px}.lb-nav.next{right:14px}
  .lb-close{position:absolute;top:14px;right:16px;color:#fff;font-size:24px;cursor:pointer;background:rgba(20,20,20,.7);border:1px solid var(--line);border-radius:8px;width:40px;height:40px}
</style>
</head>
<body>
<header>
  <h1>🛰️ Valent Intelligence</h1>
  <select id="session"><option value="">All sessions</option></select>
  <span class="sp"></span>
  <span class="lv"><span id="dot" class="dot"></span><span id="live">connecting…</span></span>
  <a href="/setup" style="color:var(--accent);font-size:13px;text-decoration:none;font-weight:600">📱 Connect phone</a>
  <a href="/download" style="color:var(--mut);font-size:12px;text-decoration:none">Install APK</a>
  <form method="post" action="/logout" style="margin:0"><button class="logout">Sign out</button></form>
</header>

<div class="status" id="status"></div>
<div class="audiobar" id="audiobar"></div>
<div class="scenestrip" id="scenestrip"></div>
<div class="feed" id="feed"><div class="row">Waiting for the live stream…</div></div>

<div class="panel" id="playerwrap" style="margin:10px 18px 0;display:none">
  <h2><span>🎧 Listen — full session timeline</span><span id="playmeta"></span></h2>
  <div class="playerbar">
    <audio id="aud" controls preload="metadata"></audio>
    <button id="golive" title="Jump to the newest audio">● LIVE</button>
  </div>
</div>

<div class="panel tpanel" id="tpanelwrap" style="margin:10px 18px 0;display:none"><h2><span>🗣 Transcript</span><span id="tmeta"></span></h2><div class="tbody" id="transcript"></div></div>

<div class="panel strwrap"><h2><span>Streams — everything captured</span><span id="strmeta"></span></h2><div class="strgrid" id="streams"></div></div>

<div class="grid">
  <div class="panel"><h2><span>Where — de-noised GPS track</span><span id="mapmeta"></span></h2><div id="map"></div></div>
  <div class="panel"><h2><span>Gallery</span><span id="galmeta"></span></h2><div class="gallery" id="gallery"></div></div>
</div>

<div id="lightbox" class="lightbox">
  <button class="lb-close" onclick="closeLb()">✕</button>
  <button class="lb-nav prev" onclick="navLb(-1)">‹</button>
  <div id="lbcontent"></div>
  <button class="lb-nav next" onclick="navLb(1)">›</button>
  <div class="lb-cap" id="lbcap"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/hls.js@1/dist/hls.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = t => String(t==null?'':t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let map, trackLayer;
let knownGallery = new Set();          // urls already shown, so new ones can flash
let evCount = 0, lastEventMs = 0;

function initMap(){
  map = L.map('map', {zoomControl:true}).setView([53.3,-113.6], 4);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(map);
  trackLayer = L.layerGroup().addTo(map);
}
function fmtAgo(ms){ if(!ms) return '—'; const s=(Date.now()-ms)/1000;
  if(s<90) return Math.round(s)+'s ago'; if(s<5400) return Math.round(s/60)+'m ago';
  if(s<172800) return Math.round(s/3600)+'h ago'; return Math.round(s/86400)+'d ago'; }

let firstLoad = true;
async function loadSessions(){
  const r = await fetch('/api/sessions'); const rows = await r.json();
  const sel = $('#session'); const cur = sel.value;
  sel.innerHTML = '<option value="">All sessions</option>' + rows.map(s=>{
    const d = s.last_wall ? new Date(Number(s.last_wall)).toLocaleString() : s.id;
    return `<option value="${s.id}">${s.id} · ${s.device||''} · ${d}</option>`;
  }).join('');
  // Default to the currently-live (newest) session on first load, so the view is scoped + filtered
  // to it immediately rather than showing an "All sessions" blend. rows[0] is newest (last_wall desc).
  if(firstLoad && !cur && rows.length){ sel.value = rows[0].id; firstLoad = false; }
  else sel.value = cur;
}
function setChip(el, val){ if(el && el.textContent !== String(val)){ el.textContent = val; el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); } }
async function loadStatus(){
  const sess = $('#session').value;
  const s = await (await fetch('/api/status'+(sess?`?session=${encodeURIComponent(sess)}`:''))).json();
  const t = s.totals||{};
  const chips = [
    ['Doing', s.activity ? s.activity.label : '—', s.activity && s.activity.wall],
    ['Last seen', s.location ? `${s.location.lat.toFixed(3)}, ${s.location.lon.toFixed(3)}` : '—', s.location && s.location.wall],
    ['Wi-Fi', s.wifi ? s.wifi.count+' APs' : '—', s.wifi && s.wifi.wall],
    ['Satellites', s.gnss ? `${s.gnss.used}/${s.gnss.inView}` : '—', s.gnss && s.gnss.wall],
    ['Media', (t.media||0)+' items', null],
    ['Records', Number(t.records||0).toLocaleString(), null],
  ];
  $('#status').innerHTML = chips.map(([k,v,w])=>`<div class="chip"><div class="k">${k}</div><div class="v">${v}</div>${w?`<div class="k" style="margin-top:3px">${fmtAgo(w)}</div>`:''}</div>`).join('');
  // Live audio banner: what's being heard + what's playing (the transcript has its own panel).
  const ab=[];
  if(s.scene) ab.push(`<div class="abchip hearing"><span class="ic">🔊</span><div><div class="k">Now hearing · ${fmtAgo(s.scene.wall)}</div><div class="v">${esc(s.scene.label)} · ${Math.round((s.scene.score||0)*100)}%</div></div></div>`);
  if(s.nowPlaying){ const np=s.nowPlaying; const t=[np.title,np.artist].filter(Boolean).map(esc).join(' — ');
    const app=np.app?np.app.split('.').pop():''; const playing=(np.state===3||np.state==='playing');
    ab.push(`<div class="abchip${playing?' playing':''}"><span class="ic">🎵</span><div><div class="k">Now playing${app?' · '+esc(app):''}</div><div class="v">${t||'—'}</div></div></div>`); }
  $('#audiobar').innerHTML = ab.join('');
}
async function loadScene(){
  const sess=$('#session').value;
  const rows=await (await fetch('/api/scene'+(sess?`?session=${encodeURIComponent(sess)}`:''))).json();
  const strip=$('#scenestrip');
  if(!Array.isArray(rows)||!rows.length){ strip.innerHTML=''; return; }
  const seq=[]; for(const r of rows){ const last=seq[seq.length-1];
    if(last && last.label===r.label){ last.wall=r.wall; last.score=Math.max(last.score,r.score||0); } else seq.push({label:r.label,score:r.score||0,wall:r.wall}); }
  const recent=seq.slice(-16);
  strip.innerHTML='<span class="lbl">Heard · 3 min</span>'+recent.map((t,i)=>`<span class="stag${i===recent.length-1?' cur':''}">${esc(t.label)}</span>`).join('');
}
async function loadTranscript(){
  const sess=$('#session').value;
  const r=await (await fetch('/api/transcript'+(sess?`?session=${encodeURIComponent(sess)}`:''))).json();
  const wrap=$('#tpanelwrap'), body=$('#transcript');
  if(!r.segments || !r.segments.length){ wrap.style.display='none'; return; }
  wrap.style.display='';
  $('#tmeta').textContent = r.count.toLocaleString()+' segments';
  const atBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 60;
  body.innerHTML = r.segments.map((seg,i)=>`<span class="seg${i===r.segments.length-1?' last':''}">${esc(seg.text)} </span>`).join('');
  if(atBottom) body.scrollTop = body.scrollHeight;   // keep pinned to the newest unless scrolled up
}
function kmBetween(a,b){ const R=6371,d2r=Math.PI/180;
  const dLat=(b.lat-a.lat)*d2r, dLon=(b.lon-a.lon)*d2r, la=a.lat*d2r, lb=b.lat*d2r;
  const h=Math.sin(dLat/2)**2+Math.cos(la)*Math.cos(lb)*Math.sin(dLon/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
async function loadTrack(){
  const sess = $('#session').value;
  const pts = (await (await fetch('/api/track'+(sess?`?session=${encodeURIComponent(sess)}`:''))).json())
                .filter(p=>p.suspect!=='true');
  trackLayer.clearLayers();
  $('#mapmeta').textContent = pts.length ? pts.length.toLocaleString()+' pts' : '';
  if(!pts.length) return;
  // One continuous line PER session (like the phone) — bridge any time/coverage gaps with a straight
  // segment rather than dropping the connection into disconnected dashes. Only a session change starts
  // a new line, so "All sessions" still shows each journey separately without joining them.
  const segs=[]; let cur=[];
  for(const p of pts){
    if(cur.length && p.session_id!==cur[cur.length-1].session_id){ segs.push(cur); cur=[]; }
    cur.push(p);
  }
  if(cur.length) segs.push(cur);
  const all=[];
  for(const seg of segs){
    const line=seg.map(p=>[p.lat,p.lon]); all.push(...line);
    if(line.length>1) L.polyline(line,{color:'#ff5a3c',weight:3,opacity:.85}).addTo(trackLayer);
    else L.circleMarker(line[0],{radius:3,color:'#ff5a3c',fillColor:'#ff5a3c',fillOpacity:.8}).addTo(trackLayer);
  }
  const last=pts[pts.length-1];   // ordered by session then time → newest session's latest fix
  L.circleMarker([last.lat,last.lon],{radius:7,color:'#fff',weight:3,fillColor:'#ff5a3c',fillOpacity:1}).addTo(trackLayer);
  try{ map.fitBounds(L.latLngBounds(all.length?all:[[last.lat,last.lon]]).pad(0.2)); }catch(e){}
}
let strState={};
async function loadStreams(){
  const sess=$('#session').value;
  const rows=await (await fetch('/api/streams'+(sess?`?session=${encodeURIComponent(sess)}`:''))).json();
  $('#strmeta').textContent = rows.length ? rows.length+' streams' : '';
  const g=$('#streams');
  if(!rows.length){ g.innerHTML='<div class="empty">No streams yet.</div>'; return; }
  g.innerHTML = rows.map(r=>{
    const prev=strState[r.stream];
    const changed = prev && (prev.records!==r.records || prev.files!==r.files);
    const val = r.records ? r.records.toLocaleString()+' rec' : r.files+' file'+(r.files===1?'':'s');
    return `<div class="scell${changed?' flash':''}"><div class="sname">${r.stream}</div>`+
      `<div class="sval">${val}</div><div class="sago">${r.files} files · ${fmtAgo(r.lastRecv)}</div></div>`;
  }).join('');
  rows.forEach(r=>strState[r.stream]={records:r.records,files:r.files});
}
let galleryItems=[], lbIdx=0;
async function loadGallery(){
  const sess = $('#session').value;
  const items = await (await fetch('/api/gallery'+(sess?`?session=${encodeURIComponent(sess)}`:''))).json();
  galleryItems = items;
  const g = $('#gallery');
  $('#galmeta').textContent = items.length ? items.length+' items' : '';
  if(!items.length){ g.innerHTML='<div class="empty">No photos or video yet.</div>'; knownGallery=new Set(); return; }
  g.innerHTML = items.map((it,i)=>{
    const fresh = knownGallery.size && !knownGallery.has(it.url) ? ' fresh' : '';
    const inner = it.type==='video'
      ? `<video src="${it.url}" muted preload="metadata"></video><span class="pv">▶</span>`
      : `<img loading="lazy" src="${it.url}">`;
    return `<figure class="fig${fresh}" onclick="openLb(${i})">${inner}</figure>`;
  }).join('');
  knownGallery = new Set(items.map(it=>it.url));
}
function openLb(i){ lbIdx=i; renderLb(); $('#lightbox').classList.add('open'); }
function closeLb(){ $('#lightbox').classList.remove('open'); $('#lbcontent').innerHTML=''; }
function navLb(d){ if(!galleryItems.length) return; lbIdx=(lbIdx+d+galleryItems.length)%galleryItems.length; renderLb(); }
function renderLb(){
  const it=galleryItems[lbIdx]; if(!it) return;
  $('#lbcontent').innerHTML = it.type==='video'
    ? `<video src="${it.url}" controls autoplay></video>`
    : `<img src="${it.url}">`;
  const when = it.received_at ? new Date(it.received_at).toLocaleString() : '';
  $('#lbcap').textContent = `${it.session_id} · ${it.filename}${when?' · '+when:''}   (${lbIdx+1}/${galleryItems.length})`;
}
document.addEventListener('keydown', e=>{ if(!$('#lightbox').classList.contains('open')) return;
  if(e.key==='Escape') closeLb(); else if(e.key==='ArrowLeft') navLb(-1); else if(e.key==='ArrowRight') navLb(1); });
$('#lightbox') && $('#lightbox').addEventListener('click', e=>{ if(e.target.id==='lightbox') closeLb(); });
// ---- audio: the whole session as ONE continuous, scrubbable HLS timeline (+ a live edge) ----
// hls.js turns the .aac chunks into a single seekable stream with gapless joins + look-ahead buffering;
// an EVENT playlist follows the live edge and grows as chunks land. Native <audio controls> gives the
// scrubber/play/time for free, so you can loop back and hear the recording as one timeline.
let hls=null, playerSession=null, followLive=false;
function fmtDur(sec){ sec=Math.round(sec||0); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(s).padStart(2,'0'); }
async function loadAudio(){
  const sess=$('#session').value;
  const r=await (await fetch('/api/audio'+(sess?`?session=${encodeURIComponent(sess)}`:''))).json();
  const n=(r.clips&&r.clips.length)||0;
  $('#playerwrap').style.display = n?'':'none';
  $('#playmeta').textContent = n ? fmtDur(r.seconds)+' of audio' : '';
  if(n && sess && sess!==playerSession) initPlayer(sess);
  if(!n){ playerSession=null; }
}
function initPlayer(sess){
  playerSession=sess; followLive=false;
  const aud=$('#aud'); const url='/api/audio/hls?session='+encodeURIComponent(sess);
  if(window.Hls && Hls.isSupported()){
    if(hls){ hls.destroy(); hls=null; }
    hls=new Hls({ enableWorker:true, liveSyncDurationCount:3, maxBufferLength:120 });
    hls.on(Hls.Events.ERROR,(e,d)=>{ if(d&&d.fatal){
      if(d.type===Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
      else if(d.type===Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
    }});
    hls.loadSource(url); hls.attachMedia(aud);
  } else if(aud.canPlayType('application/vnd.apple.mpegurl')){
    aud.src=url;   // Safari: native HLS
  }
}
function goLive(){
  const aud=$('#aud'); followLive=true;
  const edge = (hls && hls.liveSyncPosition!=null) ? hls.liveSyncPosition : (isFinite(aud.duration)?aud.duration:0);
  if(edge>0) aud.currentTime=Math.max(0, edge-0.25);
  aud.play().catch(()=>{});
}
async function refresh(){ await Promise.all([loadStatus(), loadScene(), loadTranscript(), loadStreams(), loadTrack(), loadGallery(), loadAudio()]); }

// ---- live status indicator ----
function setLive(state){
  const dot = $('#dot'), txt = $('#live');
  dot.className = 'dot ' + (state==='streaming'?'on':state==='reconnecting'?'warn':'off');
  txt.textContent = state==='streaming'
    ? `live · ${evCount} events · ${fmtAgo(lastEventMs)}`
    : state==='reconnecting' ? 'reconnecting…' : 'offline';
}
setInterval(()=>{ // decay to "idle" if no event for >90s, and keep the "ago" fresh
  if(lastEventMs && Date.now()-lastEventMs>90000) { $('#dot').className='dot warn'; $('#live').textContent='idle · '+fmtAgo(lastEventMs); }
  else if(lastEventMs) $('#live').textContent=`live · ${evCount} events · ${fmtAgo(lastEventMs)}`;
}, 5000);

// ---- live feed ticker ----
function pushFeed(ev){
  const t = new Date(ev.at||Date.now()).toLocaleTimeString();
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `${t}  ${ev.session}  <span class="add">+${ev.storedNew||0} files · +${Number(ev.records||0).toLocaleString()} records</span>`;
  const feed = $('#feed'); feed.prepend(row);
  while(feed.childElementCount>1) feed.lastElementChild.remove();
}

// ---- SSE: the real-time stream. EventSource auto-reconnects, so a Wi-Fi switch self-heals. ----
let refreshT=null;
function scheduleRefresh(){ clearTimeout(refreshT); refreshT=setTimeout(()=>{ refresh(); loadSessions(); }, 1200); }
let liveT=null;
function scheduleLiveRefresh(){ clearTimeout(liveT); liveT=setTimeout(()=>{ loadTrack(); loadStatus(); loadScene(); }, 800); }
function connectStream(){
  const es = new EventSource('/api/stream', { withCredentials:true });
  es.onopen = ()=> setLive(lastEventMs?'streaming':'streaming');
  es.onerror = ()=> setLive('reconnecting');   // browser retries automatically (retry: 3000)
  es.onmessage = (e)=>{
    let ev; try{ ev=JSON.parse(e.data); }catch(_){ return; }
    const sel=$('#session').value; const forUs = !sel || sel===ev.session;
    if(ev.type==='ingest'){
      evCount++; lastEventMs=Date.now(); setLive('streaming'); pushFeed(ev);
      if(forUs){ scheduleRefresh(); loadAudio(); }   // refresh meta; hls.js auto-extends the live edge
    } else if(ev.type==='live'){
      lastEventMs=Date.now(); setLive('streaming');
      if(forUs) scheduleLiveRefresh();          // fast: just the map head + scene
    } else if(ev.type==='photo'){
      lastEventMs=Date.now(); setLive('streaming');
      if(forUs) loadGallery();                  // instant: new photo appears immediately
    }
  };
}

initMap();
$('#golive').addEventListener('click', goLive);
loadSessions().then(refresh).then(connectStream);
// Switching sessions: tear down the current stream so the player reloads for the new one.
$('#session').addEventListener('change', ()=>{ firstLoad=false; if(hls){ hls.destroy(); hls=null; } playerSession=null; refresh(); });
// Reliable baseline: refresh everything (incl. audio clip count + gallery) every 15s, so the view
// stays current even when SSE is quiet or drops — common on spotty/in-flight links. SSE on top gives
// the instant nudges (new photo in ~2s, fresh map head). Playback isn't interrupted by a list refresh.
setInterval(()=>{ loadSessions(); refresh(); }, 15000);
</script>
