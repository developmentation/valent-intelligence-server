<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline Monitor</title>
<style>
  :root{ --bg:#0d1117; --panel:#161b22; --line:#26303b; --ink:#e6edf3; --dim:#8b949e; --accent:#58a6ff;
         --run:#3fb950; --wait:#d29922; --fail:#f85149; --done:#8b949e; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.02em}
  .pill{padding:2px 9px;border-radius:20px;font-size:12px;border:1px solid var(--line)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .live .dot{background:var(--run);box-shadow:0 0 0 0 rgba(63,185,80,.6);animation:pulse 1.6s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 6px rgba(63,185,80,0)}100%{box-shadow:0 0 0 0 rgba(63,185,80,0)}}
  .muted{color:var(--dim)}
  main{padding:16px 20px;max-width:1400px}
  .cards{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;min-width:180px}
  .card .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}
  .card .v{font-size:22px;font-weight:600;margin-top:2px}
  .scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
  table{border-collapse:collapse;width:100%;min-width:900px;font-size:13px}
  th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{position:sticky;top:0;background:var(--panel);color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  tr:hover td{background:#12171e}
  .st{font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.04em}
  .st.running{color:var(--run)} .st.done{color:var(--done)} .st.failed{color:var(--fail)} .st.skipped{color:var(--wait)}
  .phase{color:var(--accent)}
  .bars{display:flex;gap:2px;align-items:flex-end;height:22px}
  .bar{width:9px;background:#2d3b4d;border-radius:2px 2px 0 0}
  .bar.on{background:var(--accent)}
  .foot{margin-top:14px;color:var(--dim);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>◗ PIPELINE MONITOR</h1>
  <span id="conn" class="pill"><span class="dot"></span><span id="connt">connecting…</span></span>
  <span class="pill muted" id="clock">—</span>
  <span class="muted" style="margin-left:auto;font-size:12px">content-free · refreshes every 3s</span>
</header>
<main>
  <div class="cards">
    <div class="card"><div class="k">Active now</div><div class="v" id="cActive">—</div></div>
    <div class="card"><div class="k">Current session</div><div class="v" id="cSession" style="font-size:16px">—</div></div>
    <div class="card"><div class="k">Phase · model</div><div class="v" id="cPhase" style="font-size:16px">—</div></div>
    <div class="card"><div class="k">Done today</div><div class="v" id="cDone">—</div></div>
  </div>
  <div class="scroll">
    <table>
      <thead><tr>
        <th>Session</th><th>Status</th><th>Phase</th><th>Model</th><th>Chunks</th><th>Segs</th>
        <th>Elapsed</th><th>Phase timings</th><th>Updated</th><th>Box</th>
      </tr></thead>
      <tbody id="rows"><tr><td colspan="10" class="muted">loading…</td></tr></tbody>
    </table>
  </div>
  <div class="foot" id="foot"></div>
</main>
<script>
const PHASE_ORDER = ["download","ingest","candidates","whisper","distil","novad","qwen","cohere","granite","fusion","post","done"];
const fmtDur = s => s==null ? "—" : (s<60 ? s+"s" : s<3600 ? Math.floor(s/60)+"m"+String(s%60).padStart(2,"0")+"s" : Math.floor(s/3600)+"h"+String(Math.floor(s%3600/60)).padStart(2,"0")+"m");
const ago = s => s==null ? "—" : (s<5 ? "just now" : fmtDur(s)+" ago");
function phaseBars(phases){
  const p = phases||{};
  return '<span class="bars" title="'+Object.entries(p).map(([k,v])=>k+" "+fmtDur(Math.round(v))).join(" · ").replace(/"/g,'')+'">'
    + PHASE_ORDER.map(ph=>{ const on=p[ph]!=null; return '<span class="bar'+(on?' on':'')+'" style="height:'+(on?Math.min(22,6+Math.log2(1+(p[ph]||0))*3):5)+'px"></span>'; }).join('')
    + '</span>';
}
async function tick(){
  try{
    const r = await fetch('/api/pipeline-status?limit=100',{headers:{'accept':'application/json'}});
    if(!r.ok) throw new Error('http '+r.status);
    const d = await r.json();
    document.getElementById('conn').className='pill live';
    document.getElementById('connt').textContent = d.active_count>0 ? d.active_count+' running' : 'idle';
    document.getElementById('clock').textContent = new Date(d.now*1000).toISOString().replace('T',' ').slice(0,19)+' UTC';
    const a = (d.active&&d.active[0])||null;
    document.getElementById('cActive').textContent = d.active_count;
    document.getElementById('cSession').textContent = a ? a.session : '—';
    document.getElementById('cPhase').innerHTML = a ? '<span class="phase">'+(a.phase||'?')+'</span>'+(a.model?' · '+a.model:'') : '—';
    const today = new Date(d.now*1000).toISOString().slice(0,10);
    document.getElementById('cDone').textContent = d.runs.filter(x=>x.status==='done' && x.ended_at && new Date(x.ended_at*1000).toISOString().slice(0,10)===today).length;
    const rows = d.runs.map(x=>{
      const st = x.status||'running';
      return '<tr>'
        +'<td>'+x.session_id+'</td>'
        +'<td><span class="st '+st+'">'+(x.live?'● ':'')+st+'</span></td>'
        +'<td class="phase">'+(x.phase||'—')+'</td>'
        +'<td>'+(x.model||'—')+'</td>'
        +'<td>'+(x.n_chunks??'—')+'</td>'
        +'<td>'+(x.n_segments??'—')+'</td>'
        +'<td>'+fmtDur(x.elapsed_secs ?? (x.status==='running'&&x.started_at?(d.now-x.started_at):null))+'</td>'
        +'<td>'+phaseBars(x.phases)+'</td>'
        +'<td class="muted">'+ago(x.age_secs)+'</td>'
        +'<td class="muted">'+(x.box||'—')+'</td>'
        +'</tr>';
    }).join('');
    document.getElementById('rows').innerHTML = rows || '<tr><td colspan="10" class="muted">no runs yet</td></tr>';
    document.getElementById('foot').textContent = d.runs.length+' session-runs tracked';
  }catch(e){
    document.getElementById('conn').className='pill';
    document.getElementById('connt').textContent = 'offline ('+e.message+')';
  }
}
tick(); setInterval(tick, 3000);
</script>
</body>
</html>
