<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<title>Valent — Live</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07090d; --ink:#f5f7fa; --mut:rgba(245,247,250,.62); --dim:rgba(245,247,250,.38);
    --accent:#ff5a3c; --live:#3ce38f; --glass:rgba(16,19,26,.55); --line:rgba(255,255,255,.10);
    --disp:"Space Grotesk", system-ui, sans-serif; --mono:"JetBrains Mono", ui-monospace, monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--disp);
    overflow:hidden;-webkit-font-smoothing:antialiased;height:100dvh;position:relative}
  button{font-family:inherit;color:inherit;cursor:pointer}

  /* ---- media stage: two cross-fading layers ---- */
  #stage{position:fixed;inset:0;background:var(--bg);z-index:0}
  .layer{position:absolute;inset:0;opacity:0;transition:opacity .85s ease;will-change:opacity}
  .layer.on{opacity:1}
  .layer .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    filter:blur(46px) brightness(.42) saturate(1.1);transform:scale(1.15)}
  .layer .fg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
    animation:kb 18s ease-out both}
  @keyframes kb{from{transform:scale(1.06)}to{transform:scale(1)}}
  video.fg{background:#000}

  /* ---- scrims for legibility ---- */
  #scrim{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:
      linear-gradient(to bottom, rgba(4,6,9,.60) 0%, rgba(4,6,9,0) 22%),
      linear-gradient(to top, rgba(4,6,9,.86) 0%, rgba(4,6,9,.30) 30%, rgba(4,6,9,0) 52%)}

  /* ---- top bar ---- */
  #top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:flex-start;
    justify-content:space-between;gap:12px;padding:max(16px,env(safe-area-inset-top)) 18px 10px 18px}
  .brand{display:flex;align-items:center;gap:11px;min-width:0}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--live);flex:none;
    box-shadow:0 0 0 0 rgba(60,227,143,.65);animation:pulse 2s infinite}
  .dot.replay{background:var(--accent);animation:none;box-shadow:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(60,227,143,.55)}70%{box-shadow:0 0 0 12px rgba(60,227,143,0)}100%{box-shadow:0 0 0 0 rgba(60,227,143,0)}}
  .badge{font-family:var(--mono);font-size:11px;letter-spacing:.16em;font-weight:600;text-transform:uppercase}
  .badge .st{color:var(--live)}.badge.replay .st{color:var(--accent)}
  .sub{font-family:var(--mono);font-size:10.5px;color:var(--mut);letter-spacing:.04em;margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tools{display:flex;gap:8px;align-items:center;flex:none}
  .tbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--glass);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:grid;place-items:center;
    transition:.18s;position:relative}
  .tbtn:hover{border-color:rgba(255,255,255,.24);background:rgba(28,32,42,.7)}
  .tbtn svg{width:18px;height:18px;stroke:var(--ink);stroke-width:1.9;fill:none;
    stroke-linecap:round;stroke-linejoin:round;opacity:.9}
  .tbtn.soon::after{content:"";position:absolute;top:7px;right:7px;width:5px;height:5px;border-radius:50%;
    background:var(--accent);opacity:.85}
  .tbtn.off{opacity:.5}

  /* ---- fusion HUD (bottom-left) ---- */
  #fusion{position:fixed;z-index:5;left:18px;bottom:calc(112px + env(safe-area-inset-bottom));
    max-width:min(560px,72vw);display:flex;flex-direction:column;gap:12px;pointer-events:none}
  #fusion>*{pointer-events:auto}
  .place{font-family:var(--disp);font-weight:600;font-size:clamp(24px,4.6vw,42px);line-height:1.02;
    letter-spacing:-.015em;text-shadow:0 2px 22px rgba(0,0,0,.5);margin:0}
  .coords{font-family:var(--mono);font-size:12px;color:var(--mut);margin-top:6px;letter-spacing:.02em}
  .facts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;
    border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    font-family:var(--mono);font-size:12px;color:var(--ink);letter-spacing:.02em;white-space:nowrap}
  .chip svg{width:14px;height:14px;stroke:var(--accent);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .chip .k{color:var(--dim);text-transform:uppercase;font-size:10px;letter-spacing:.1em}
  .chip.scene{color:var(--mut)}.chip.scene.cur{color:var(--ink);border-color:rgba(255,90,60,.5)}
  .np{display:flex;align-items:center;gap:11px;padding:9px 14px 9px 11px;border-radius:14px;
    border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    max-width:100%}
  .eq{display:flex;align-items:flex-end;gap:2.5px;height:18px;flex:none}
  .eq i{width:3px;background:var(--accent);border-radius:2px;animation:eq 1s ease-in-out infinite}
  .eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}.eq i:nth-child(4){animation-delay:.15s}
  @keyframes eq{0%,100%{height:5px}50%{height:17px}}
  .np .t{min-width:0}.np .t .ti{font-family:var(--disp);font-weight:600;font-size:14px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .np .t .ar{font-family:var(--mono);font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fade-swap{transition:opacity .35s}

  /* ---- battery pill + staleness + details modal ---- */
  .batt{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:11px;
    border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink)}
  .batt .ico{position:relative;width:22px;height:11px;border:1.5px solid currentColor;border-radius:2.5px;opacity:.9}
  .batt .ico::after{content:"";position:absolute;right:-3.5px;top:2.5px;width:2px;height:4px;background:currentColor;border-radius:0 1px 1px 0}
  .batt .ico i{position:absolute;left:1px;top:1px;bottom:1px;background:currentColor;border-radius:1px;transition:width .4s}
  .batt.ok{color:var(--live)} .batt.mid{color:#f5c451} .batt.low{color:#ff5a3c}
  .batt .bolt{font-size:11px;margin-left:-2px}
  .stale{display:none;margin-top:3px;font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;color:#f5c451}
  .stale.show{display:block}
  #infomodal{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:20px;
    background:rgba(4,6,9,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  #infomodal.open{display:grid}
  .infocard{width:min(360px,92vw);border-radius:18px;border:1px solid var(--line);background:rgba(14,17,23,.94);
    -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);padding:18px 20px 12px;box-shadow:0 20px 60px rgba(0,0,0,.55)}
  .infohd{display:flex;justify-content:space-between;align-items:center;font-family:var(--disp);font-weight:600;font-size:15px;margin-bottom:10px}
  .infohd button{background:none;border:0;font-size:22px;line-height:1;color:var(--mut)}
  #inforows .r{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-top:1px solid rgba(255,255,255,.06);
    font-family:var(--mono);font-size:12.5px}
  #inforows .r .k{color:var(--mut)} #inforows .r .v{color:var(--ink);text-align:right}

  /* ---- mini map (bottom-right) ---- */
  #mapwrap{position:fixed;z-index:5;right:18px;bottom:calc(112px + env(safe-area-inset-bottom));
    width:230px;height:172px;border-radius:16px;overflow:hidden;border:1px solid var(--line);
    box-shadow:0 12px 40px rgba(0,0,0,.5);background:#0a0d12;transition:opacity .3s}
  #map{width:100%;height:100%;background:#0a0d12}
  .leaflet-container{background:#0a0d12;font-family:var(--mono)}
  .headpulse{width:14px;height:14px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 0 0 rgba(255,90,60,.6);animation:pulse2 2s infinite;border:2px solid #fff}
  @keyframes pulse2{0%{box-shadow:0 0 0 0 rgba(255,90,60,.55)}70%{box-shadow:0 0 0 14px rgba(255,90,60,0)}100%{box-shadow:0 0 0 0 rgba(255,90,60,0)}}
  #mapwrap{cursor:pointer}
  #mapwrap.expanded{position:fixed!important;inset:0!important;top:0!important;left:0!important;
    right:0!important;bottom:0!important;width:100%!important;height:100%!important;border-radius:0;border:0;z-index:40;cursor:default}
  .mbtn{position:absolute;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);
    background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:grid;place-items:center;z-index:1001}
  .mbtn svg{width:17px;height:17px;stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.92}
  #mapexpand{right:7px;top:7px;width:30px;height:30px}
  #mapexpand svg{width:15px;height:15px}
  #mapctl{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;z-index:1001;display:none;gap:9px}
  #mapctl .mbtn{position:static}
  #mapwrap.expanded #mapexpand{display:none}
  #mapwrap.expanded #mapctl{display:flex}

  /* ---- filmstrip ---- */
  #strip{position:fixed;left:0;right:0;bottom:0;z-index:6;
    padding:10px 14px calc(12px + env(safe-area-inset-bottom)) 14px;
    display:flex;align-items:center;gap:10px;
    background:linear-gradient(to top, rgba(4,6,9,.85), rgba(4,6,9,0))}
  #livepill{flex:none;display:inline-flex;align-items:center;gap:7px;height:60px;padding:0 15px;border-radius:13px;
    border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;transition:.18s}
  #livepill.hot{border-color:rgba(60,227,143,.55);color:var(--live)}
  #livepill .n{display:none;background:var(--accent);color:#fff;border-radius:999px;padding:1px 7px;font-size:10px}
  #livepill.has-new .n{display:inline-block}
  #films{display:flex;gap:9px;overflow-x:auto;overflow-y:hidden;flex:1;padding:2px;scrollbar-width:thin;
    scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
  #films::-webkit-scrollbar{height:0}
  .thumb{position:relative;flex:none;width:84px;height:60px;border-radius:11px;overflow:hidden;cursor:pointer;
    border:2px solid transparent;background:#12151c;transition:transform .2s,border-color .2s;animation:tin .5s ease both}
  @keyframes tin{from{opacity:0;transform:translateY(8px) scale(.92)}to{opacity:1;transform:none}}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .45s}
  .thumb img.rdy{opacity:1}
  .thumb video{width:100%;height:100%;object-fit:cover;display:block}
  /* skeleton shimmer while the bytes are still coming over a flaky link */
  .thumb.loading{background:linear-gradient(100deg,#12151c 30%,#1c2230 50%,#12151c 70%);
    background-size:220% 100%;animation:tin .5s ease both, shim 1.4s linear infinite}
  @keyframes shim{from{background-position:220% 0}to{background-position:-40% 0}}
  .thumb:hover{transform:translateY(-2px)}
  .thumb.cur{border-color:var(--accent)}
  /* stage loader — a quiet spinner instead of a black screen while the current image loads */
  #stageload{position:fixed;inset:0;z-index:2;display:none;place-items:center;pointer-events:none}
  #stageload.show{display:grid}
  #stageload .sp{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.18);
    border-top-color:var(--accent);animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .thumb .pv{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.28)}
  .thumb .pv svg{width:22px;height:22px;fill:#fff;opacity:.95}

  /* ---- side panel (transcript / audio stubs) ---- */
  #panel{position:fixed;z-index:9;top:0;right:0;bottom:0;width:min(380px,86vw);transform:translateX(100%);
    transition:transform .3s ease;background:rgba(10,12,17,.86);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
    border-left:1px solid var(--line);padding:calc(18px + env(safe-area-inset-top)) 20px 20px;display:flex;flex-direction:column}
  #panel.open{transform:none}
  #panel h3{font-family:var(--disp);font-size:15px;margin:0 0 4px;display:flex;justify-content:space-between;align-items:center}
  #panel .soonp{margin-top:40px;text-align:center;color:var(--mut);font-family:var(--mono);font-size:12.5px;line-height:1.7}
  #panel .soonp .big{font-size:34px;margin-bottom:10px;opacity:.5}
  #pclose{background:none;border:0;font-size:22px;line-height:1;color:var(--mut)}

  /* ---- toast / empty ---- */
  #toast{position:fixed;z-index:8;left:50%;top:16px;transform:translateX(-50%);padding:8px 16px;border-radius:999px;
    background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);
    font-family:var(--mono);font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none}
  #toast.show{opacity:1}
  #empty{position:fixed;inset:0;z-index:4;display:none;place-items:center;text-align:center;padding:24px}
  #empty.show{display:grid}
  #empty .e{font-family:var(--mono);color:var(--mut);font-size:13px;line-height:1.8}
  #empty .e .big{font-family:var(--disp);font-size:22px;color:var(--ink);margin-bottom:8px;letter-spacing:-.01em}

  #unmute{position:fixed;z-index:7;right:18px;bottom:calc(300px + env(safe-area-inset-bottom));display:none;
    align-items:center;gap:8px;padding:8px 13px;border-radius:999px;border:1px solid var(--line);
    background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);font-family:var(--mono);font-size:11px}
  #unmute.show{display:inline-flex}
  #unmute svg{width:15px;height:15px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  /* ---- responsive: phones ---- */
  @media (max-width:720px){
    #mapwrap{width:132px;height:98px;right:12px;bottom:auto;top:calc(64px + env(safe-area-inset-top))}
    #fusion{left:12px;right:12px;max-width:none;bottom:calc(96px + env(safe-area-inset-bottom))}
    .place{font-size:clamp(22px,7vw,34px)}
    .thumb{width:70px;height:50px}
    #livepill{height:50px}
    #unmute{bottom:auto;top:calc(172px + env(safe-area-inset-top));right:12px}
    .tbtn.soon{display:none}   /* hide inert transcript/audio stubs on phones to save the top row */
    .batt{height:34px;padding:0 9px}
  }
</style>
</head>
<body>
  <div id="stage"><div class="layer" id="layA"></div><div class="layer" id="layB"></div></div>
  <div id="stageload"><div class="sp"></div></div>
  <div id="scrim"></div>

  <div id="top">
    <div class="brand">
      <span class="dot" id="livedot"></span>
      <div style="min-width:0">
        <div class="badge" id="badge"><span class="st">LIVE</span> <span id="devname" style="color:var(--mut)"></span></div>
        <div class="sub" id="subline">connecting…</div>
        <div class="stale" id="stale"></div>
      </div>
    </div>
    <div class="tools">
      <div class="batt" id="battery" style="display:none" title="Capture-device battery"></div>
      <button class="tbtn" id="btnInfo" title="Details">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.6v.01"/></svg></button>
      <button class="tbtn soon off" id="btnTranscript" title="Transcript (coming soon)">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 10h16M4 14h10M4 18h7"/></svg></button>
      <button class="tbtn soon off" id="btnAudio" title="Audio (coming soon)">
        <svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4zM16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg></button>
      <button class="tbtn" id="btnFull" title="Fullscreen">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button class="tbtn" id="btnOut" title="Sign out">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
    </div>
  </div>

  <div id="fusion">
    <div>
      <h1 class="place" id="place">—</h1>
      <div class="coords" id="coords"></div>
      <div class="coords" id="localtime" style="margin-top:3px;color:var(--dim)"></div>
    </div>
    <div class="facts" id="facts"></div>
    <div class="np fade-swap" id="np" style="display:none">
      <div class="eq"><i></i><i></i><i></i><i></i></div>
      <div class="t"><div class="ti" id="npTitle"></div><div class="ar" id="npArtist"></div></div>
    </div>
  </div>

  <div id="mapwrap">
    <div id="map"></div>
    <button id="mapexpand" class="mbtn" title="Expand map"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <div id="mapctl">
      <button id="maptheme" class="mbtn" title="Light / dark tiles"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg></button>
      <button id="mapclose" class="mbtn" title="Close map"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
  </div>

  <button id="unmute"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4zM16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg> Tap for sound</button>

  <div id="strip">
    <button id="livepill"><span class="dot" style="width:7px;height:7px"></span><span id="pilltext">LIVE</span><span class="n" id="pillnew">1</span></button>
    <div id="films"></div>
  </div>

  <div id="panel">
    <h3><span id="panelTitle">Transcript</span><button id="pclose">×</button></h3>
    <div class="soonp"><div class="big" id="panelIcon">✎</div><div id="panelBody">Live transcript will appear here.<br>Coming soon.</div></div>
  </div>

  <div id="infomodal">
    <div class="infocard">
      <div class="infohd"><span>Details</span><button id="infoclose">×</button></div>
      <div id="inforows"></div>
    </div>
  </div>

  <div id="empty"><div class="e"><div class="big">Waiting for a live capture…</div>No media yet. This view wakes up the moment a session starts sending photos or video.</div></div>
  <div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $=s=>document.querySelector(s);
const LIVE_WINDOW=4*60*1000;   // a session with a batch/fix newer than this = LIVE
const POLL_MS=15000;           // baseline refresh (SSE nudges in between)
const REPLAY_MS=6000;          // per-image dwell in the ended-session carousel
const UNPIN_MS=20000;          // after a manual pick, revert to auto/newest

let map, trackLayer, headMarker, tileLayer, mapExpanded=false;
let mapTheme='dark'; try{ mapTheme=localStorage.getItem('liveMapTheme')||'dark'; }catch(e){}
const TILES={ dark:'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
              light:'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png' };
// first/last are DEVICE wall clock (for duration); liveAt is the SERVER receive time (updated_at) —
// the skew-proof recency signal used for live/replay + "last signal", since the device clock can be wrong.
let state={ sid:null, device:'', live:false, first:0, last:0, liveAt:0,
  items:[], curIdx:0, auto:true, track:[], unpinT:null, replayT:null, muted:true,
  pinnedLoc:null, lastStatus:null, tzOffsetMin:null };

// ---------- map ----------
function setTiles(theme){
  mapTheme=theme; try{ localStorage.setItem('liveMapTheme',theme); }catch(e){}
  if(tileLayer) map.removeLayer(tileLayer);
  tileLayer=L.tileLayer(TILES[theme]||TILES.dark,{maxZoom:19,subdomains:'abcd'}).addTo(map);
  $('#mapwrap').style.background=(theme==='light'?'#e9edf0':'#0a0d12');
}
function initMap(){
  // Mini map is a glance view: interactions OFF (a tap expands it). All are re-enabled when expanded.
  map=L.map('map',{zoomControl:false,attributionControl:false,dragging:false,scrollWheelZoom:false,
    doubleClickZoom:false,touchZoom:false,boxZoom:false,keyboard:false,tap:false}).setView([20,0],2);
  setTiles(mapTheme);
  trackLayer=L.layerGroup().addTo(map);
}
// Fit the view to the whole GPS path. The mini map refits on every update (always shows the full
// bounds); the expanded map fits once on open and is then free to pan/zoom without being yanked back.
function fitTrack(){
  const line=state.track.filter(p=>p.suspect!=='true').map(p=>[p.lat,p.lon]);
  if(line.length){ try{ map.fitBounds(L.latLngBounds(line).pad(mapExpanded?.12:.3)); }catch(e){} }
}
function drawTrack(pts){
  trackLayer.clearLayers(); headMarker=null;
  const line=pts.filter(p=>p.suspect!=='true').map(p=>[p.lat,p.lon]);
  if(line.length>1) L.polyline(line,{color:'#ff5a3c',weight:mapExpanded?3:2.5,opacity:.85}).addTo(trackLayer);
  if(line.length && !state.pinnedLoc){ const last=line[line.length-1]; moveHead(last[0],last[1]); }
  if(!mapExpanded) fitTrack();   // mini map: always frame the whole path
}
function setMapInteractive(on){
  ['dragging','scrollWheelZoom','doubleClickZoom','touchZoom','boxZoom','keyboard'].forEach(k=>{
    if(map[k]){ on?map[k].enable():map[k].disable(); }
  });
}
function expandMap(){
  if(mapExpanded) return; mapExpanded=true;
  $('#mapwrap').classList.add('expanded'); setMapInteractive(true);
  if(!map._zc){ map._zc=L.control.zoom({position:'bottomright'}); map._zc.addTo(map); }
  setTimeout(()=>{ map.invalidateSize(); fitTrack(); },70);
  setTimeout(()=>map.invalidateSize(),340);
}
function collapseMap(){
  if(!mapExpanded) return; mapExpanded=false;
  $('#mapwrap').classList.remove('expanded'); setMapInteractive(false);
  if(map._zc){ map.removeControl(map._zc); map._zc=null; }
  setTimeout(()=>{ map.invalidateSize(); fitTrack(); },70);
  setTimeout(()=>map.invalidateSize(),340);
}
function moveHead(lat,lon){
  if(lat==null||lon==null) return;
  const icon=L.divIcon({className:'',html:'<div class="headpulse"></div>',iconSize:[14,14],iconAnchor:[7,7]});
  if(!headMarker){ headMarker=L.marker([lat,lon],{icon}).addTo(map); }
  else headMarker.setLatLng([lat,lon]);
}
// nearest track point (by time) to a media item — powers the GPS-mapped carousel
function locForTime(t){
  if(!state.track.length) return null;
  let best=null,bd=Infinity;
  for(const p of state.track){ const d=Math.abs((p.wall||0)-t); if(d<bd){bd=d;best=p;} }
  return best;
}

// ---------- reverse geocode (best-effort, cached, coords fallback) ----------
const geoCache=new Map(); let lastGeoKey='';
async function placeName(lat,lon){
  const key=lat.toFixed(3)+','+lon.toFixed(3);
  if(key===lastGeoKey) return; lastGeoKey=key;
  if(geoCache.has(key)){ setPlace(geoCache.get(key)); return; }
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=14&lat=${lat}&lon=${lon}`,
      {headers:{'Accept':'application/json'}});
    const d=await r.json(); const a=d.address||{};
    const parts=[a.neighbourhood||a.suburb||a.hamlet||a.village||a.town||a.city_district,
                 a.city||a.town||a.county, a.state||a.country].filter(Boolean);
    const name=[...new Set(parts)].slice(0,2).join(', ')|| d.name || null;
    if(name){ geoCache.set(key,name); setPlace(name); }
  }catch(e){ /* keep coords */ }
}
function setPlace(name){ if(name) $('#place').textContent=name; }
// One place to drive the HUD's location: coords + place name + map pin. Used for the live "current"
// position AND for a selected photo (its own GPS), so browsing the strip repoints the map + name.
function setLocDisplay(lat,lon,acc){
  if(lat==null||lon==null) return;
  $('#coords').textContent=`${lat.toFixed(5)}, ${lon.toFixed(5)}`+(acc?`  ·  ±${Math.round(acc)}m`:'');
  const key=lat.toFixed(3)+','+lon.toFixed(3);
  $('#place').textContent = geoCache.has(key)?geoCache.get(key):`${lat.toFixed(3)}, ${lon.toFixed(3)}`;
  placeName(lat,lon); moveHead(lat,lon);
}
function stageLoading(on){ const el=$('#stageload'); if(el) el.classList.toggle('show', !!on); }

// ---------- media stage (cross-fade) ----------
let front=$('#layA'), back=$('#layB'), curVideo=null, stageGen=0;
// Blank the stage — used on a session switch so a new session with no media yet can't keep showing the
// PREVIOUS session's image, and so a stale async load can't reveal old content.
function clearStage(){ stageGen++; front.innerHTML=''; back.innerHTML=''; front.classList.remove('on'); back.classList.remove('on'); curVideo=null; stageLoading(false); }
function showItem(idx,{fade=true}={}){
  const it=state.items[idx]; if(!it) return;
  const gen=++stageGen;   // supersede any in-flight load; only the latest showItem may reveal
  state.curIdx=idx; markStrip();
  // The newest item while auto+live = "current": show the LIVE position (status-driven). Any other
  // item (a strip pick, or replay) = show THAT photo's own GPS + place name, pinned on the map.
  const showingCurrent = state.auto && state.live && idx===0;
  if(showingCurrent){ state.pinnedLoc=null; const l=state.lastStatus&&state.lastStatus.location; if(l) setLocDisplay(l.lat,l.lon,l.acc); }
  else { const L2=locForTime(new Date(it.received_at).getTime()); if(L2){ state.pinnedLoc={lat:L2.lat,lon:L2.lon}; setLocDisplay(L2.lat,L2.lon,L2.acc); } }
  back.innerHTML=''; curVideo=null;
  // Reveal the freshly-built BACK layer exactly ONCE. (The old code could call this twice — e.g. a
  // load event AND a timeout — and each call swapped the layers, so the second flipped the PREVIOUS
  // media back into view. That was the "it plays the old image/video" glitch.)
  let swapped=false;
  // Reveal the freshly-built BACK layer exactly once, and ONLY if this is still the latest showItem
  // (gen check) — so a superseded load from a previous item/session can never swap old media in.
  const done=()=>{ if(swapped || gen!==stageGen) return; swapped=true; stageLoading(false); back.classList.add('on'); front.classList.remove('on'); [front,back]=[back,front]; };
  if(it.type==='video'){
    $('#unmute').classList.remove('show');
    const v=document.createElement('video'); v.className='fg'; v.src=it.url;
    // Muted autoplay (allowed by browsers): H.264 plays fine while it buffers — no "squares" (those
    // were HEVC clips the browser can't decode at all). Reveal the first frame, then nudge play on
    // canplay; controls stay so the viewer can play/scrub/unmute. On error still show the element,
    // never flip back to the previous item.
    v.muted=true; v.autoplay=true; v.playsInline=true; v.controls=true; v.preload='auto';
    v.setAttribute('playsinline',''); v.setAttribute('autoplay',''); v.setAttribute('muted',''); curVideo=v;
    const tryplay=()=>{ if(gen===stageGen) v.play().catch(()=>{}); };
    v.addEventListener('loadeddata',()=>{ done(); tryplay(); },{once:true});    // reveal first frame + start
    v.addEventListener('canplay', tryplay, {once:true});                        // nudge once enough is buffered
    v.addEventListener('error',()=>{ done(); },{once:true});   // show the element (controls), don't flip back
    v.addEventListener('ended',()=>{ if(state.mode==='replay') stepReplay(); });
    const bg=document.createElement('div'); bg.className='bg'; bg.style.background='#000';
    back.append(bg,v);
    setTimeout(done, 5000);   // guarded: if metadata is slow, reveal once; can never double-swap now
  }else{
    $('#unmute').classList.remove('show'); stageLoading(true);
    const im=new Image(); im.className='fg'; im.decoding='async';
    const bg=document.createElement('img'); bg.className='bg';
    let tries=0;
    im.onload=done;
    // Flaky wifi/cell: retry a few times with a cache-busting param before giving up (keeps the strip
    // box, doesn't wedge the stage black).
    im.onerror=()=>{ if(tries++<3){ setTimeout(()=>{ const u=it.url+(it.url.includes('?')?'&':'?')+'r='+tries+'_'+Date.now(); bg.src=u; im.src=u; }, 2500); } else { done(); } };
    bg.src=it.url; im.src=it.url;
    back.append(bg,im);
  }
}
function jumpNewest(){ state.auto=true; clearTimeout(state.unpinT); setPill(); if(state.items.length) showItem(0); }
function pinManual(idx){
  state.auto=false; setPill(); showItem(idx);
  clearTimeout(state.unpinT);
  state.unpinT=setTimeout(()=>{ jumpNewest(); if(state.mode==='replay') startReplay(); },UNPIN_MS);
  if(state.mode==='replay') clearInterval(state.replayT);
}

// ---------- replay carousel (ended session) ----------
function startReplay(){
  clearInterval(state.replayT);
  if(state.mode!=='replay'||!state.items.length) return;
  state.replayT=setInterval(()=>{ if(state.auto) stepReplay(); },REPLAY_MS);
}
function stepReplay(){
  if(!state.items.length) return;
  // oldest -> newest then loop (items are newest-first, so walk indices downward)
  let next=state.curIdx-1; if(next<0) next=state.items.length-1;
  showItem(next);
}

// ---------- render fusion HUD ----------
function svg(p){return `<svg viewBox="0 0 24 24">${p}</svg>`;}
// Great-circle distance (m) + bearing between [lat,lon] pairs — for de-jittered pace and journey length.
function havM(a,b){const R=6371000,r=Math.PI/180,dLat=(b[0]-a[0])*r,dLon=(b[1]-a[1])*r,la=a[0]*r,lb=b[0]*r;
  const h=Math.sin(dLat/2)**2+Math.cos(la)*Math.cos(lb)*Math.sin(dLon/2)**2; return 2*R*Math.asin(Math.sqrt(h));}
function bearingDeg(a,b){const r=Math.PI/180,y=Math.sin((b[1]-a[1])*r)*Math.cos(b[0]*r),
  x=Math.cos(a[0]*r)*Math.sin(b[0]*r)-Math.sin(a[0]*r)*Math.cos(b[0]*r)*Math.cos((b[1]-a[1])*r);
  return (Math.atan2(y,x)/r+360)%360;}
function dir8(d){return ['N','NE','E','SE','S','SW','W','NW'][Math.round(d/45)%8];}
function fmtDur(sec){sec=Math.max(0,Math.round(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);
  return h>0?`${h}h${String(m).padStart(2,'0')}m`:`${m}m`;}
// Pace: displacement over a ~50s window (≥6 points if sparse) / elapsed — de-jittered by averaging over
// distance, never a single noisy fix. Heading is the window's net bearing. moving=false below ~1.5 km/h.
function computePace(){
  const pts=state.track.filter(p=>p.suspect!=='true'&&p.lat!=null);
  if(pts.length<2) return null;
  const last=pts[pts.length-1], tEnd=last.wall||0;
  let i=pts.length-1; while(i>0 && (tEnd-(pts[i].wall||0))<50000) i--;
  if((tEnd-(pts[i].wall||0))/1000<6) i=Math.max(0,pts.length-6);
  const start=pts[i], span=(tEnd-(start.wall||0))/1000;
  if(span<=0) return null;
  let dist=0; for(let k=i+1;k<pts.length;k++) dist+=havM([pts[k-1].lat,pts[k-1].lon],[pts[k].lat,pts[k].lon]);
  const kmh=(dist/span)*3.6;
  return {kmh, dir:dir8(bearingDeg([start.lat,start.lon],[last.lat,last.lon])), moving:kmh>=1.5};
}
function journeyStats(){
  const pts=state.track.filter(p=>p.suspect!=='true'&&p.lat!=null);
  let m=0; for(let k=1;k<pts.length;k++) m+=havM([pts[k-1].lat,pts[k-1].lon],[pts[k].lat,pts[k].lon]);
  return {km:m/1000, durSec:(state.last&&state.first)?(state.last-state.first)/1000:0};
}
function renderBattery(b){
  const el=$('#battery');
  if(!b||b.percent==null||b.percent<0){ el.style.display='none'; return; }
  const p=Math.max(0,Math.min(100,Math.round(b.percent)));
  el.style.display='inline-flex';
  el.className='batt '+(p<=15?'low':p<=40?'mid':'ok');
  el.innerHTML=`<span class="ico"><i style="width:${Math.max(2,p/100*17).toFixed(1)}px"></i></span>${b.charging?'<span class="bolt">⚡</span>':''}${p}%`;
}
function renderStatus(s){
  state.lastStatus=s;
  const loc=s.location;
  // Only drive the map/place from the LIVE position when we're actually showing "current" (no photo
  // pinned) — otherwise a selected photo's place/pin would be overwritten by the live fix.
  if(loc && !state.pinnedLoc) setLocDisplay(loc.lat, loc.lon, loc.acc);
  const facts=[];
  // activity + de-jittered pace + heading, as one line
  const pace=computePace();
  let txt = s.activity ? esc(s.activity.label) : (pace&&pace.moving?'Moving':'');
  if(pace&&pace.moving) txt=(txt||'Moving')+` · ${pace.kmh<10?pace.kmh.toFixed(1):Math.round(pace.kmh)} km/h · ${pace.dir}`;
  if(txt) facts.push(`<span class="chip">${svg('<path d="M13 4v6l4 2M6 20l3-6"/><circle cx="12" cy="12" r="9"/>')}<span>${txt}</span></span>`);
  // journey so far
  const j=journeyStats();
  if(j.km>=0.05 || j.durSec>=60){
    const dist=j.km>=1?`${j.km.toFixed(1)} km`:`${Math.round(j.km*1000)} m`;
    facts.push(`<span class="chip">${svg('<path d="M4 20l6-15 3 9 3-5 4 11z"/>')}<span class="k">journey</span> ${dist} · ${fmtDur(j.durSec)}</span>`);
  }
  // altitude — only when notably off the ground
  if(loc && loc.alt!=null && Math.abs(loc.alt)>=80)
    facts.push(`<span class="chip">${svg('<path d="M3 20l5-10 4 6 3-4 6 8z"/>')}<span class="k">alt</span> ${Math.round(loc.alt).toLocaleString()} m</span>`);
  $('#facts').innerHTML=facts.join('');
  renderBattery(s.battery);
  // now playing
  if(s.nowPlaying && (s.nowPlaying.title||s.nowPlaying.artist)){
    $('#np').style.display='flex'; $('#npTitle').textContent=s.nowPlaying.title||s.nowPlaying.artist;
    $('#npArtist').textContent=[s.nowPlaying.artist,s.nowPlaying.app].filter(Boolean).join(' · ');
  } else $('#np').style.display='none';
  if($('#infomodal').classList.contains('open')) fillInfo();
}
// The details modal (ⓘ): the diagnostic readouts kept off the main HUD.
function fillInfo(){
  const s=state.lastStatus||{}, rows=[];
  const add=(k,v)=>{ if(v!=null&&v!=='') rows.push(`<div class="r"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`); };
  add('Session', state.sid||'—');
  add('State', state.live?'Live':'Replay');
  add('Last signal', state.liveAt?fmtAgo(state.liveAt):'—');
  add('Local time', fmtLocal(Date.now()));
  add('UTC', new Date().toISOString().substr(11,5));
  if(s.battery&&s.battery.percent!=null) add('Battery', Math.round(s.battery.percent)+'%'+(s.battery.charging?' · charging':''));
  if(s.gnss) add('Satellites', `${s.gnss.used}/${s.gnss.inView} in view`);
  if(s.location&&s.location.acc!=null) add('GPS accuracy', `±${Math.round(s.location.acc)} m`);
  if(s.location&&s.location.alt!=null) add('Altitude', `${Math.round(s.location.alt).toLocaleString()} m`);
  if(s.wifi) add('Wi-Fi', `${s.wifi.count} networks`);
  const j=journeyStats(); if(j.km>0) add('Distance', j.km>=1?j.km.toFixed(2)+' km':Math.round(j.km*1000)+' m');
  add('Media', state.items.length?state.items.length+' items':null);
  $('#inforows').innerHTML=rows.join('')||'<div class="r"><span class="k">No details yet</span></div>';
}
function renderScene(list){
  if(!list||!list.length) return;
  // Distinct labels by MOST-RECENT occurrence (not just consecutive) — so an alternating history like
  // "Field recording, Vehicle, Field recording, Vehicle" collapses to two chips, never doubled.
  const seen=new Set(), rev=[];
  for(let i=list.length-1;i>=0 && rev.length<4;i--){ const l=list[i].label; if(!seen.has(l)){ seen.add(l); rev.push(list[i]); } }
  const tail=rev.reverse();   // oldest→newest of the distinct set; last = current
  const html=tail.map((t,i)=>`<span class="chip scene${i===tail.length-1?' cur':''}">${svg('<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>')}${esc(t.label)}</span>`).join('');
  // keep scene chips after the fact chips
  const base=$('#facts').querySelectorAll('.chip:not(.scene)');
  $('#facts').innerHTML=Array.from(base).map(n=>n.outerHTML).join('')+html;
}

// ---------- filmstrip ----------
// We know the item list even when the bytes are slow (flaky wifi/cell), so lay out a skeleton box PER
// item immediately and fade each image in when it loads; retry a few times before giving up. The boxes
// are always present (anticipating the load), never a blank strip.
function thumbImg(d, url){
  const img=new Image(); img.alt=''; let tries=0;
  img.onload=()=>{ d.classList.remove('loading'); img.classList.add('rdy'); };
  img.onerror=()=>{ if(tries++<4) setTimeout(()=>{ img.src=url+(url.includes('?')?'&':'?')+'r='+tries+'_'+Date.now(); }, 3000); };
  img.src=url; d.appendChild(img);
}
function renderStrip(){
  const f=$('#films'); f.innerHTML='';
  state.items.forEach((it,i)=>{
    const d=document.createElement('div'); d.className='thumb loading'+(i===state.curIdx?' cur':'');
    if(it.type==='video'){
      // A <video> (not <img>) can render a poster frame; H.264 shows a thumbnail, others just stay dark
      // under the play badge. Either way the tile is clearly a video and clickable.
      const v=document.createElement('video'); v.src=it.url+'#t=0.1'; v.muted=true; v.preload='metadata'; v.playsInline=true;
      v.addEventListener('loadeddata',()=>{ d.classList.remove('loading'); },{once:true});
      v.addEventListener('error',()=>{ d.classList.remove('loading'); },{once:true});
      d.appendChild(v);
      const pv=document.createElement('div'); pv.className='pv'; pv.innerHTML=svg('<path d="M8 5v14l11-7z"/>');
      pv.querySelector('svg').setAttribute('fill','#fff'); pv.querySelector('svg').removeAttribute('stroke');
      d.appendChild(pv);
    } else thumbImg(d, it.url);
    d.onclick=()=>pinManual(i);
    f.appendChild(d);
  });
}
function markStrip(){
  const kids=$('#films').children;
  for(let i=0;i<kids.length;i++) kids[i].classList.toggle('cur',i===state.curIdx);
  const cur=kids[state.curIdx]; if(cur) cur.scrollIntoView({inline:'center',block:'nearest'});
}
function setPill(){
  const p=$('#livepill'), txt=$('#pilltext');
  if(state.mode==='replay'){ txt.textContent=state.auto?'REPLAY':'PAUSED'; p.classList.remove('hot'); }
  else { txt.textContent='LIVE'; p.classList.toggle('hot',state.auto); }
  if(state.auto) p.classList.remove('has-new');
}

// ---------- data loading ----------
async function jget(u){ const r=await fetch(u,{credentials:'same-origin'}); if(r.status===401){ location.href='/login?next=/live'; throw 0; } return r.json(); }

async function pickSession(){
  const rows=await jget('/api/sessions');
  if(!rows.length){ $('#empty').classList.add('show'); $('#subline').textContent='no sessions yet'; return; }
  const s=rows[0];  // newest
  const upd=Date.parse(s.updated_at||'')||0;
  const isLive=(Date.now()-upd)<LIVE_WINDOW;   // recency by SERVER receive time, not the device clock
  if(s.id!==state.sid){ await enterSession(s,isLive); }
  else { state.liveAt=Math.max(state.liveAt,upd); refreshMode(); }
}
async function enterSession(s,isLive){
  clearInterval(state.replayT);
  clearStage();   // wipe the previous session's media off the stage before we load this one's
  state.pinnedLoc=null;
  state.sid=s.id; state.device=s.device||''; state.first=Number(s.first_wall||0); state.last=Number(s.last_wall||0);
  state.liveAt=Date.parse(s.updated_at||'')||Date.now();
  state.tzOffsetMin=(s.tz_offset_min!=null)?Number(s.tz_offset_min):null;   // subject-local time offset
  state.live=isLive; state.auto=true; state.mode=isLive?'live':'replay';
  $('#empty').classList.remove('show');
  $('#devname').textContent=state.device;
  const [gal,trk]=await Promise.all([ jget('/api/gallery?session='+encodeURIComponent(s.id)),
                                      jget('/api/track?session='+encodeURIComponent(s.id)) ]);
  state.items=gal; state.track=trk.filter(p=>p.lat!=null);
  drawTrack(state.track); renderStrip();
  refreshMode();
  if(state.items.length){ state.curIdx=state.mode==='replay'?state.items.length-1:0; showItem(state.curIdx,{fade:false}); }
  await refreshFusion();
  toast(isLive?'● Live session':'Replaying last session');
}
function refreshMode(){
  const now=Date.now(); const live=(now-state.liveAt)<LIVE_WINDOW;   // liveAt = server receive time
  state.live=live; state.mode=live?'live':'replay';
  $('#livedot').className='dot'+(live?'':' replay'); $('#badge').className='badge'+(live?'':' replay');
  $('#badge .st').textContent=live?'LIVE':'REPLAY';
  const dur=Math.max(0,(state.last-state.first)); const mins=Math.round(dur/60000);   // device walls → duration
  $('#subline').textContent=(state.sid||'')+'  ·  '+(live?('live · '+fmtAgo(state.liveAt)):(mins+' min session'));
  // Staleness: a "live" session with no signal for >2 min is likely stalled (battery died, lost
  // connectivity, or interrupted). Surface how long it's been quiet; >4 min it drops to REPLAY above.
  const stale=$('#stale'), gap=now-state.liveAt;
  if(live && gap>120000){ stale.className='stale show'; stale.textContent='⚠ no signal for '+fmtAgo(state.liveAt).replace(' ago',''); }
  else stale.className='stale';
  updateClock();
  setPill();
  if(state.mode==='replay') startReplay(); else clearInterval(state.replayT);
}
async function refreshFusion(){
  try{
    const [s,sc]=await Promise.all([ jget('/api/status?session='+encodeURIComponent(state.sid)),
                                     jget('/api/scene?session='+encodeURIComponent(state.sid)+'&mins=10') ]);
    renderStatus(s); renderScene(sc);
  }catch(e){}
}
async function refreshTrack(){
  try{ const trk=await jget('/api/track?session='+encodeURIComponent(state.sid));
    state.track=trk.filter(p=>p.lat!=null); drawTrack(state.track);
    if(state.live && !state.pinnedLoc){ const last=state.track[state.track.length-1]; if(last) moveHead(last.lat,last.lon); }
  }catch(e){}
}

// new media arrived for the current session
async function onNewMedia(url){
  try{
    const gal=await jget('/api/gallery?session='+encodeURIComponent(state.sid));
    const beforeTop=state.items[0]&&state.items[0].url;
    state.items=gal; renderStrip();
    const changed=state.items[0]&&state.items[0].url!==beforeTop;
    if(changed){
      if(state.auto){ showItem(0); }                       // fade the newest in
      else { const p=$('#livepill'); p.classList.add('has-new');
             $('#pillnew').textContent='1'; }              // browsing: flag, don't yank
    }
  }catch(e){}
}

// ---------- SSE + polling (always fresh) ----------
function connectSSE(){
  try{
    const es=new EventSource('/api/stream',{withCredentials:true});
    es.onmessage=e=>{
      let d; try{ d=JSON.parse(e.data);}catch(_){return;}
      if(!d||!d.type||!d.session) return;   // session-less events (e.g. error) don't concern /live
      // A newer session (or the first one) appearing on ANY lane — photo, live fix, or bulk batch —
      // means a fresh capture started: follow it immediately. Session ids are timestamp-prefixed, so
      // string-greater = newer. The 15s poll is only a backstop.
      if(!state.sid || d.session>state.sid){ pickSession(); return; }
      if(d.session!==state.sid) return;     // a straggler from an older session — ignore
      state.liveAt=Date.now(); if(d.wall) state.last=Number(d.wall); refreshMode(); // any event keeps it "live"
      if(d.type==='photo'){ onNewMedia(d.url); }
      else if(d.type==='live'){ if(d.lat!=null && state.live && !state.pinnedLoc) moveHead(d.lat,d.lon); }
      else if(d.type==='ingest'){ refreshFusion(); }
    };
    es.onerror=()=>{ /* browser auto-reconnects */ };
  }catch(e){}
}
function loop(){ pickSession().catch(()=>{}); refreshFusion(); if(state.live) refreshTrack(); }

// ---------- misc ----------
function fmtAgo(ms){ if(!ms) return '—'; const s=(Date.now()-ms)/1000;
  if(s<90) return Math.round(s)+'s ago'; if(s<5400) return Math.round(s/60)+'m ago';
  if(s<172800) return Math.round(s/3600)+'h ago'; return Math.round(s/86400)+'d ago'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
// Storage is UTC (all wall fields are epoch ms). The DISPLAY is the SUBJECT's local time: shift the
// real UTC instant by the captured device offset and read it as UTC. Falls back to null (→ UTC shown).
function fmtLocal(ms){ if(state.tzOffsetMin==null) return null; return new Date(ms + state.tzOffsetMin*60000).toISOString().substr(11,5); }
function updateClock(){ const el=$('#localtime'); if(!el) return; const t=fmtLocal(Date.now()); el.textContent = t ? (t+' · local time') : ''; }
let toastT; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600); }

// controls
$('#livepill').onclick=()=>{ jumpNewest(); if(state.mode==='replay') startReplay(); };
$('#btnFull').onclick=()=>{ if(!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); };
$('#btnOut').onclick=()=>{ fetch('/logout',{method:'POST',credentials:'same-origin'}).then(()=>location.href='/login'); };
$('#unmute').onclick=()=>{ state.muted=false; if(curVideo){ curVideo.muted=false; curVideo.play().catch(()=>{}); } $('#unmute').classList.remove('show'); };
function openPanel(kind){ $('#panel').classList.add('open'); $('#panelTitle').textContent=kind==='audio'?'Audio':'Transcript';
  $('#panelIcon').textContent=kind==='audio'?'♪':'✎';
  $('#panelBody').innerHTML=kind==='audio'?'Session audio playback will live here.<br>Coming soon.':'Live speech-to-text will appear here.<br>Coming soon.'; }
$('#btnTranscript').onclick=()=>openPanel('transcript');
$('#btnAudio').onclick=()=>openPanel('audio');
$('#pclose').onclick=()=>$('#panel').classList.remove('open');
// keep "live" freshness label ticking
setInterval(()=>{ if(state.sid) refreshMode(); },30000);
setInterval(updateClock,10000);   // subject-local clock ticks independently of data refreshes

// map controls: tap the mini map (or the expand icon) to go full-screen; close/theme in the corner.
$('#mapwrap').addEventListener('click',()=>{ if(!mapExpanded) expandMap(); });
$('#mapexpand').addEventListener('click',e=>{ e.stopPropagation(); expandMap(); });
$('#mapclose').addEventListener('click',e=>{ e.stopPropagation(); collapseMap(); });
$('#maptheme').addEventListener('click',e=>{ e.stopPropagation(); setTiles(mapTheme==='dark'?'light':'dark'); });

// details modal (ⓘ) — satellites, wifi, accuracy, battery… kept off the main HUD
$('#btnInfo').addEventListener('click',()=>{ fillInfo(); $('#infomodal').classList.add('open'); });
$('#infoclose').addEventListener('click',()=>$('#infomodal').classList.remove('open'));
$('#infomodal').addEventListener('click',e=>{ if(e.target.id==='infomodal') $('#infomodal').classList.remove('open'); });

// boot
initMap();
pickSession().then(connectSSE);
setInterval(loop,POLL_MS);
</script>
