<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Audio Truth Timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500&display=swap">
<style>
:root{--bg:#0c0e13;--panel:#141821;--ink:#e8eaee;--muted:#8b93a1;--line:#232a36;--accent:#4f8cff;
--near:#2dd4bf;--far:#e0864a;--noise:#e0556e;--olap:#a97bff;--serif:'Newsreader',Georgia,serif;
--mono:'IBM Plex Mono',ui-monospace,monospace;--sans:'IBM Plex Sans',system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}
.wrap{max-width:1100px;margin:0 auto;padding:16px 14px 40px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1{font-size:22px;margin:.2em 0 .1em;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;max-width:80ch;line-height:1.5}
.readout{font-family:var(--serif);font-size:23px;line-height:1.35;min-height:70px;margin:12px 0 6px;padding:11px 13px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.readout .cur{padding:2px 4px;border-radius:5px;font-weight:600}
.segdec{font-family:var(--mono);font-size:12px;color:var(--ink);min-height:18px;margin:0 2px 8px;letter-spacing:.2px}
.segdec .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:0}
.segdec .mono2{color:var(--muted);font-size:11px}
.segdec .elc{margin-top:4px;color:#9ecbff;font-family:var(--serif);font-size:15px;line-height:1.3}
.elpanel{margin:2px 0 8px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#0f1621}
.elhdr{font-family:var(--mono);font-size:12px;color:#9ecbff;padding:8px 12px;cursor:pointer;user-select:none;letter-spacing:.03em}
.elhdr #elcount{color:var(--muted)}
.elbody{font-family:var(--serif);font-size:19px;line-height:1.35;padding:2px 13px 12px;color:#5b6b82}
.elbody .cur{background:#2b6cb0;color:#fff;padding:2px 4px;border-radius:5px;font-weight:600}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:8px 0 6px}
button.play{background:var(--accent);color:#fff;border:0;border-radius:22px;font-family:var(--mono);font-size:14px;font-weight:600;padding:9px 20px;cursor:pointer}
.t{font-family:var(--mono);font-size:13px;color:var(--muted)}.t b{color:var(--ink)}
.zoom{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.zoom input{width:150px;accent-color:var(--accent)}
.scrub{width:100%;height:34px;position:relative;background:#0e131b;border:1px solid var(--line);border-radius:8px;margin:6px 0 2px;overflow:hidden;cursor:pointer}
.scrub .ov{position:absolute;top:0;bottom:0;left:0;background:linear-gradient(90deg,rgba(79,140,255,.25),rgba(79,140,255,.10));width:0}
.scrub .ph{position:absolute;top:0;bottom:0;width:2px;background:#fff;left:0}
.scrub .lbl{position:absolute;top:8px;font-family:var(--mono);font-size:10px;color:var(--muted)}
canvas{width:100%;height:320px;display:block;background:var(--panel);border:1px solid var(--line);border-radius:12px;touch-action:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:10px}
.legend .sw{display:inline-block;width:22px;height:9px;border-radius:2px;vertical-align:0}
.grad-conf{background:linear-gradient(90deg,hsl(2,70%,50%),hsl(60,70%,50%),hsl(128,60%,45%))}
.grad-nf{background:linear-gradient(90deg,var(--far),var(--near))}
footer{margin-top:18px;font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.7}
.err{background:#2a1416;border:1px solid #5b2a2f;color:#f0b8bd;padding:12px 14px;border-radius:10px;font-family:var(--mono);font-size:13px;margin:14px 0}
.loading{color:var(--muted);font-family:var(--mono);font-size:13px;padding:20px 0}
a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
<div class="eyebrow">Server-hosted · streams the full session</div>
<h1 id="h1">Audio Truth Timeline</h1>
<p class="sub" id="sub">Loading…</p>
<div id="err"></div>
<div class="readout" id="readout"></div>
<div class="segdec" id="segdec"></div>
<div class="elpanel" id="elpanel" style="display:none">
 <div class="elhdr" id="elhdr"><span id="elarrow">▸</span> ElevenLabs transcript <span id="elcount" class="mono2"></span></div>
 <div class="elbody" id="elbody" style="display:none"></div>
</div>
<div class="bar">
 <button class="play" id="play">▶ Play</button>
 <span class="t"><b id="cur">0:00</b> / <span id="dur">–</span></span>
 <span class="zoom">zoom <input id="zoom" type="range" min="4" max="60" step="1" value="16"><b id="zval">16s</b></span>
</div>
<div class="scrub" id="scrub"><div class="ov" id="scrubov"></div><div class="ph" id="scrubph"></div></div>
<canvas id="cv"></canvas>
<div class="legend">
 <span><span class="sw grad-conf"></span> word confidence (red→green)</span>
 <span><span class="sw grad-nf"></span> near↔far / reverb / C50 (Brouhaha)</span>
 <span><span class="sw" style="background:var(--noise)"></span> SNR·Brouhaha (noisier=taller)</span>
 <span><span class="sw" style="background:rgb(110,150,255)"></span> VAD·Brouhaha (speech prob)</span>
 <span><span class="sw" style="background:var(--olap)"></span> overlap (OSD)</span>
 <span><span class="sw" style="background:#35c46a"></span> winning source</span>
</div>
<footer id="foot"></footer>
</div>
<audio id="au" preload="none" crossorigin="use-credentials"></audio>
<script src="/public/hls.min.js"></script>
<script>
const SID = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||'');
const $=id=>document.getElementById(id);
const AU=$('au'); let D=null, PMIN=null, PMAX=null, PR=100, DUR=0, viewSec=16, tags=[], words=[], segs=[], elWords=[], elOpen=false;
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function fmt(t){t=Math.max(0,t||0);const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=Math.floor(t%60);return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0');}
function b64i8(b){const bin=atob(b);const a=new Int8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i)<<24>>24;return a;}
function fbColT(t){t=Math.max(0,Math.min(1,t));const far=[224,134,98],near=[45,212,191];const c=far.map((v,i)=>Math.round(v+(near[i]-v)*t));return`rgb(${c[0]},${c[1]},${c[2]})`;}
function nfCol(c){return fbColT((c-0.15)/0.6);}
function rvCol(s){return fbColT((s-1.5)/8);}
function c50Col(c){return fbColT((c-10)/25);}
function confCol(c){if(c==null)return'#3a4150';let t=Math.max(0,Math.min(1,(c-0.55)/0.45)),h=2+t*126;return`hsl(${h.toFixed(0)},68%,${(52+t*6).toFixed(0)}%)`;}
const SRCCOL={mix:'#4f8cff',norm:'#9ecbff',L:'#2dd4bf',R:'#5eead4',se_mix:'#35c46a',se_norm:'#7be0a0',peel:'#e0864a',qwen:'#a97bff',orig:'#4f8cff'};

async function boot(){
  try{
    $('sub').textContent='Loading timeline data…';
    const r=await fetch('/media/_derived/'+encodeURIComponent(SID)+'/timeline.json',{credentials:'same-origin'});
    if(!r.ok) throw new Error('timeline.json not found ('+r.status+') — has this session been processed?');
    D=await r.json();
  }catch(e){ $('err').innerHTML='<div class="err">Could not load timeline: '+esc(e.message)+'</div>'; $('sub').textContent=''; return; }
  DUR=D.dur||0; tags=D.tags||[]; words=D.words||[]; segs=D.segs||[]; elWords=D.el_words||[];
  if(D.has_el && elWords.length){
    $('elpanel').style.display='block';
    $('elcount').textContent=`— ${elWords.length} words vs ${words.length} ours`;
    $('elhdr').onclick=()=>{elOpen=!elOpen;$('elbody').style.display=elOpen?'block':'none';$('elarrow').textContent=elOpen?'▾':'▸';draw();};
  }
  if(D.peaks){PR=D.peaks.rate||100;PMIN=b64i8(D.peaks.min);PMAX=b64i8(D.peaks.max);}
  $('h1').textContent='Audio Truth Timeline — '+SID;
  $('sub').innerHTML='Full session streamed from the server ('+fmt(DUR)+', '+(D.stereo?'stereo':'mono')+'). Words shaded by <b>fused confidence</b>; lanes = near/far (coherence), reverb (SRMR), and Brouhaha\'s three outputs (C50, SNR, VAD), overlap (OSD). The <b>source</b> lane shows which candidate won each segment'+(D.has_el?'; expand <b>ElevenLabs transcript</b> to stream both finals side by side':'')+'. Scrub anywhere; drag zoom.';
  $('dur').textContent=fmt(DUR);
  $('foot').innerHTML='Session '+SID+' · '+(D.n_segments||segs.length)+' segments · pipeline: candidate matrix (Parakeet on '+(D.variants||'mix/norm/StuPASE/…')+' + Qwen) → N-way confidence fusion. Audio streamed via HLS; nothing embedded.';
  setupAudio(); fit(); draw();
}
function setupAudio(){
  const src='/api/audio/hls?session='+encodeURIComponent(SID);
  if(AU.canPlayType('application/vnd.apple.mpegurl')){ AU.src=src; }
  else if(window.Hls&&Hls.isSupported()){ const hls=new Hls({xhrSetup:x=>{x.withCredentials=true;}}); hls.loadSource(src); hls.attachMedia(AU);
    hls.on(Hls.ErrorData?'hlsError':Hls.Events.ERROR,()=>{}); }
  else { $('err').innerHTML='<div class="err">This browser can\'t play HLS and hls.js failed to load.</div>'; }
  AU.addEventListener('loadedmetadata',()=>{ if(isFinite(AU.duration)&&AU.duration>0){DUR=Math.max(DUR,AU.duration);$('dur').textContent=fmt(DUR);} });
}
const cv=$('cv'),ctx=cv.getContext('2d');let dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1)),raf=0;
function fit(){const w=cv.clientWidth;cv.width=w*dpr;cv.height=320*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
window.addEventListener('resize',()=>{fit();draw();});
// time-sorted range helpers (binary search first index with .t or .t0 >= x)
function lb(arr,key,x){let lo=0,hi=arr.length;while(lo<hi){const m=(lo+hi)>>1;if((arr[m][key])<x)lo=m+1;else hi=m;}return lo;}
function draw(){
 const W=cv.clientWidth,H=320;ctx.clearRect(0,0,W,H);
 const cur=AU.currentTime||0;const t0=cur-viewSec*0.5,t1=t0+viewSec;const X=t=>(t-t0)/viewSec*W;
 const wfY=8,wfH=64,nfY=78,nfH=12,rvY=92,rvH=12,c5Y=106,c5H=12,snY=120,snH=12,vaY=134,vaH=12,olY=148,olH=11,rtY=161,rtH=12,wdY=176,wdH=66;
 // waveform
 ctx.fillStyle='#1c2430';ctx.fillRect(0,wfY,W,wfH);
 if(PMIN){ctx.strokeStyle='#3d5a80';ctx.beginPath();const i0=Math.max(0,Math.floor(t0*PR)),i1=Math.min(PMIN.length,Math.ceil(t1*PR));
  for(let i=i0;i<i1;i++){const x=X(i/PR),mn=PMIN[i]/127,mx=PMAX[i]/127;ctx.moveTo(x,wfY+wfH/2-mx*wfH/2*0.95);ctx.lineTo(x,wfY+wfH/2-mn*wfH/2*0.95);}ctx.stroke();}
 // tag lanes (windowed)
 let ti=Math.max(0,lb(tags,'t',t0)-1);
 for(let k=ti;k<tags.length;k++){const g=tags[k];if(g.t>t1+1)break;const x=X(g.t-0.25),w=Math.max(1,X(g.t+0.25)-X(g.t-0.25));if(x+w<0||x>W)continue;
   const sp=g.sp,a=sp?1:0.5;   // non-speech (road noise etc.) still shows its acoustic tags, just a touch dimmer
   if(g.coh!=null){ctx.globalAlpha=a;ctx.fillStyle=nfCol(g.coh);ctx.fillRect(x,nfY,w,nfH);}
   if(g.srmr!=null){ctx.globalAlpha=a;ctx.fillStyle=rvCol(g.srmr);ctx.fillRect(x,rvY,w,rvH);}
   if(g.c50!=null){ctx.globalAlpha=a;ctx.fillStyle=c50Col(g.c50);ctx.fillRect(x,c5Y,w,c5H);}                       // Brouhaha C50
   {const bs=g.bsnr!=null?g.bsnr:g.snr; if(bs!=null){const nz=Math.max(0,Math.min(1,(g.bsnr!=null?(20-bs)/30:(40-bs)/18)));ctx.globalAlpha=sp?0.15+0.85*nz:0.12;ctx.fillStyle='rgb(224,85,110)';ctx.fillRect(x,snY+snH*(1-nz),w,snH*nz+2);}}  // Brouhaha SNR (fallback our SNR)
   if(g.bvad!=null){ctx.globalAlpha=0.25+0.7*g.bvad;ctx.fillStyle='rgb(110,150,255)';ctx.fillRect(x,vaY+vaH*(1-g.bvad),w,vaH*g.bvad+1);}  // Brouhaha VAD (speech prob)
   const ov=Math.max(0,Math.min(1,g.ov==null?0:g.ov));ctx.globalAlpha=ov;ctx.fillStyle='#a97bff';ctx.fillRect(x,olY,w,olH*(0.35+0.65*ov));
 }
 ctx.globalAlpha=1;
 // source lane
 ctx.fillStyle='#0e131b';ctx.fillRect(0,rtY,W,rtH);let curSeg=null;
 for(const s of segs){if(s.t1<t0||s.t0>t1)continue;const x=X(s.t0),w=Math.max(2,X(s.t1)-X(s.t0));if(cur>=s.t0&&cur<s.t1)curSeg=s;
   ctx.globalAlpha=0.9;ctx.fillStyle=SRCCOL[s.winner]||'#2f6f7e';ctx.fillRect(x,rtY+2,w,rtH-4);}
 ctx.globalAlpha=1;
 // labels
 ctx.font='10px IBM Plex Mono';ctx.fillStyle='#8b93a1';
 ctx.fillText('waveform',6,wfY+11);ctx.fillText(D.stereo?'near↔far':'near↔far·mono',6,nfY+11);ctx.fillText('reverb·SRMR',6,rvY+11);ctx.fillText('C50·Brouhaha',6,c5Y+11);ctx.fillText('SNR·Brouhaha',6,snY+11);ctx.fillText('VAD·Brouhaha',6,vaY+11);ctx.fillText('overlap',6,olY+10);ctx.fillText('source',6,rtY+10);
 // words
 ctx.fillStyle='#0e131b';ctx.fillRect(0,wdY,W,wdH);let curWord=null;
 let wi=Math.max(0,lb(words,'t0',t0-2));
 for(let k=wi;k<words.length;k++){const wd=words[k];if(wd.t0>t1)break;if(wd.t1<t0)continue;
   const x=X(wd.t0),w=Math.max(6,X(wd.t1)-X(wd.t0));const on=cur>=wd.t0&&cur<wd.t1;if(on)curWord=wd;
   ctx.globalAlpha=on?1:0.82;ctx.fillStyle=confCol(wd.c);ctx.fillRect(x+1,wdY+10,w-2,wdH-30);
   ctx.globalAlpha=1;ctx.fillStyle=on?'#fff':'#c3c9d4';ctx.font=(on?'600 ':'')+'13px IBM Plex Sans';
   ctx.save();ctx.beginPath();ctx.rect(x+1,wdY,w-2,wdH);ctx.clip();ctx.fillText(wd.w,x+4,wdY+wdH-8);ctx.restore();}
 // playhead
 const px=X(cur);ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(px,0);ctx.lineTo(px,wdY+wdH);ctx.stroke();
 ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(px-5,0);ctx.lineTo(px+5,0);ctx.lineTo(px,7);ctx.fill();
 // readout + chip
 $('cur').textContent=fmt(cur);
 $('scrubov').style.width=(DUR?cur/DUR*100:0)+'%';$('scrubph').style.left=(DUR?cur/DUR*100:0)+'%';
 const ro=$('readout');const idx=words.indexOf(curWord);
 if(idx>=0){let html='';for(let i=Math.max(0,idx-9);i<Math.min(words.length,idx+11);i++){const wd=words[i];
   if(i===idx)html+=`<span class="cur" style="background:${confCol(wd.c)};color:#000">${esc(wd.w)}</span> `;
   else html+=`<span style="color:${confCol(wd.c)}">${esc(wd.w)}</span> `;}ro.innerHTML=html;}
 // ElevenLabs transcript streaming word-by-word (when the accordion is open) — both finals during playback
 if(elOpen && elWords.length){
   let ei=Math.max(0,lb(elWords,'t0',cur)-1);
   while(ei<elWords.length-1 && elWords[ei].t1<cur) ei++;
   let eh='';for(let i=Math.max(0,ei-8);i<Math.min(elWords.length,ei+12);i++){const w=elWords[i];const on=cur>=w.t0&&cur<w.t1;
     eh+= on?`<span class="cur">${esc(w.w)}</span> `:`<span>${esc(w.w)}</span> `;}
   $('elbody').innerHTML=eh;
 }
 const sd=$('segdec');
 if(curSeg){const wl={mix:'Parakeet·mix',norm:'Parakeet·norm',L:'Parakeet·L',R:'Parakeet·R',se_mix:'StuPASE',se_norm:'Norm→StuPASE',peel:'peel',qwen:'Qwen'}[curSeg.winner]||curSeg.winner||'—';
   let h=`<span class="dot" style="background:${SRCCOL[curSeg.winner]||'#3a4150'}"></span>source <b>${wl}</b>`+(curSeg.conf!=null?` · conf ${(+curSeg.conf).toFixed(3)}`:'')+(curSeg.nsrc?` <span class="mono2">· ${curSeg.nsrc} cand</span>`:'');
   if(curSeg.el) h+=`<div class="elc">ElevenLabs${curSeg.el_agree!=null?` <span class="mono2">(agree ${curSeg.el_agree})</span>`:''}: ${esc(curSeg.el.slice(0,180))}</div>`;
   sd.innerHTML=h;
 } else sd.innerHTML='';
}
function loop(){draw();raf=requestAnimationFrame(loop);}
$('play').onclick=()=>{if(AU.paused){AU.play();}else{AU.pause();}};
AU.addEventListener('play',()=>{$('play').textContent='❚❚ Pause';cancelAnimationFrame(raf);loop();});
AU.addEventListener('pause',()=>{$('play').textContent='▶ Play';cancelAnimationFrame(raf);draw();});
AU.addEventListener('ended',()=>{$('play').textContent='▶ Play';});
AU.addEventListener('seeked',draw);AU.addEventListener('timeupdate',()=>{if(AU.paused)draw();});
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();$('play').click();}});
// canvas click-seek within window
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();const frac=(e.clientX-r.left)/r.width;const cur=AU.currentTime||0;const t0=cur-viewSec*0.5;seek(t0+frac*viewSec);});
// full-session scrubber
$('scrub').addEventListener('pointerdown',e=>{const r=$('scrub').getBoundingClientRect();seek((e.clientX-r.left)/r.width*DUR);});
function seek(t){t=Math.max(0,Math.min(DUR-0.1,t));try{AU.currentTime=t;}catch(_){}draw();}
const zoom=$('zoom');zoom.oninput=()=>{viewSec=parseFloat(zoom.value);$('zval').textContent=viewSec+'s';draw();};
boot();
</script>
</body>
</html>
